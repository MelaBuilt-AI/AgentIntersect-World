name: phase-1-checks

on:
  pull_request:
  push:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:imported-avatar-current-inputs
      - run: pnpm avatar:verify:compatibility
      - run: pnpm check:core

  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm measure:phase10
      - run: pnpm measure:phase11

  e2e-flagged:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: >-
          VITE_AIW_LOCAL_DEVELOPER_UI=1
          pnpm exec vite build apps/web --config apps/web/vite.config.ts
      - run: >-
          VITE_AIW_LOCAL_DEVELOPER_UI=1
          xvfb-run -a pnpm exec playwright test
          --config playwright.config.ts
          --fully-parallel --workers=1
          --grep-invert @phase18-5-performance
          --shard=${{ matrix.shard }}
      - name: Upload flagged browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-flagged-failure-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  e2e-unflagged:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec vite build apps/web --config apps/web/vite.config.ts
      - run: >-
          xvfb-run -a pnpm exec playwright test
          --config playwright.unflagged.config.ts
