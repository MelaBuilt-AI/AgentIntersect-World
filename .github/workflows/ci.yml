name: phase-1-checks

on:
  pull_request:
  push:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:core

  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm measure:phase10
      - run: pnpm avatar:verify
      - run: pnpm measure:phase11

  e2e-flagged:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: >-
          VITE_AIW_LOCAL_DEVELOPER_UI=1
          pnpm exec vite build apps/web --config apps/web/vite.config.ts
      - run: >-
          VITE_AIW_LOCAL_DEVELOPER_UI=1
          xvfb-run -a pnpm exec playwright test
          --config playwright.config.ts
          --shard=${{ matrix.shard }}

  e2e-unflagged:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec vite build apps/web --config apps/web/vite.config.ts
      - run: >-
          xvfb-run -a pnpm exec playwright test
          --config playwright.unflagged.config.ts
