name: Bug report
description: Report a reproducible pre-release defect using sanitized information.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private code, native chat history, personal paths, or raw trace archives. For vulnerabilities, follow SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Include the commit SHA when running from source.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node version
      placeholder: "Windows / WSL / Linux; Node 24.x"
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and execution environment
      description: "For example: native Windows Claude Code, WSL Codex, Hermes, or OpenClaw. Do not include account identifiers."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Describe the steps using a disposable project where possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Review every attachment for secrets, private conversations and identifying information before submitting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private code/conversations and identifying details from this report and its attachments.
          required: true
