<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AgentIntersect Logo</title>
  <desc id="desc">AgentIntersect static dark-square header icon, optimized for small dashboard display from the official dark-square asset.</desc>

  <defs>
    <style><![CDATA[
      .ai-shape { vector-effect: none; }
      .ai-crisp { shape-rendering: geometricPrecision; }
      
    ]]></style>

    <radialGradient id="bgRadial" cx="50%" cy="48%" r="66%">
      <stop offset="0%" stop-color="#0B2A65" stop-opacity="0.82"/>
      <stop offset="44%" stop-color="#071226" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#02050B" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="xTL" x1="512" y1="512" x2="312" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#008BFF"/>
      <stop offset="76%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#FF2D9A"/>
    </linearGradient>
    <linearGradient id="xTR" x1="512" y1="512" x2="712" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2D0"/>
      <stop offset="42%" stop-color="#00E5FF"/>
      <stop offset="75%" stop-color="#008BFF"/>
      <stop offset="100%" stop-color="#19D9FF"/>
    </linearGradient>
    <linearGradient id="xBL" x1="512" y1="512" x2="312" y2="788" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#008BFF"/>
      <stop offset="74%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#FF2D9A"/>
    </linearGradient>
    <linearGradient id="xBR" x1="512" y1="512" x2="712" y2="788" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="36%" stop-color="#008BFF"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00F2D0"/>
    </linearGradient>

    <linearGradient id="traceTL" x1="312" y1="236" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B5CFF"/>
      <stop offset="42%" stop-color="#FF2D9A"/>
      <stop offset="100%" stop-color="#FF2D2D"/>
    </linearGradient>
    <linearGradient id="traceTR" x1="712" y1="236" x2="906" y2="118" gradientUnits="userSpaceOnUse">
