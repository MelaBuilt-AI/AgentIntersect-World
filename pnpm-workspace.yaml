packages:
  - apps/*
  - packages/*

# Release builds bundle node-pty prebuilds for every shipped platform.
supportedArchitectures:
  os: [current, linux, win32]
  cpu: [current, x64]

allowBuilds:
  esbuild: true

overrides:
  find-my-way: 9.7.0
  "fast-uri@>=3.0.0 <4.0.0": 3.1.8
  "fast-uri@>=4.0.0 <5.0.0": 4.1.5
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.12
