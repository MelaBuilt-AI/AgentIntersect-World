packages:
  - apps/*
  - packages/*

# Release builds bundle node-pty prebuilds for every shipped platform.
supportedArchitectures:
  os: [current, linux, win32]
  cpu: [current, x64]

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - fast-uri@3.1.4 || 4.1.1

overrides:
  find-my-way: 9.7.0
